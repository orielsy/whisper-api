<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orielsy Stream to WebSocket Server</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f4f4f4;
        text-align: center;
      }

      h1 {
        color: #333;
      }

      .controls {
        margin: 20px auto;
        padding: 10px;
        width: 80%;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .controls input,
      .controls button {
        padding: 8px;
        margin: 5px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 0.9em;
      }

      #transcription {
        margin: 20px auto;
        border: 1px solid #ddd;
        padding: 10px;
        width: 80%;
        height: 150px;
        overflow-y: auto;
        background: white;
      }

      .label {
        font-size: 0.9em;
        color: #555;
        margin-bottom: 5px;
      }

      button {
        cursor: pointer;
      }
    </style>
    <script src="utils.js"></script>
  </head>

  <body>
    <h1>Transcribe a Web Audio Stream with Huggingface VAD + Whisper</h1>
    <div class="controls">
      <div class="control-group">
        <label class="label" for="websocketAddress">WebSocket Address:</label>
        <input
          type="text"
          id="websocketAddress"
          value="ws://localhost:8000/listen"
        />
      </div>
      <div class="control-group">
        <label class="label" for="chunk_length_seconds"
          >Chunk Length (s):</label
        >
        <input type="number" id="chunk_length_seconds" value="3" min="1" />
      </div>
      <div class="control-group">
        <label class="label" for="chunk_offset_seconds"
          >Silence at the End of Chunk (s):</label
        >
        <input type="number" id="chunk_offset_seconds" value="1" min="0" />
      </div>
      <div class="control-group">
        <label class="label" for="languageSelect">Language:</label>
        <select id="languageSelect">
          <option value="multilingual">Multilingual</option>
          <option value="italian">Italian</option>
          <option value="spanish">Spanish</option>
          <option value="french">French</option>
          <option value="german">German</option>
        </select>
      </div>
      <button onclick="initWebSocket()">Connect</button>
    </div>
    <button id="startButton" onclick="startRecording()" disabled>
      Start Streaming
    </button>
    <button id="stopButton" onclick="stopRecording()" disabled>
      Stop Streaming
    </button>
    <div id="transcription"></div>
    <br />
    <div>WebSocket: <span id="webSocketStatus">Not Connected</span></div>

    <script>
      let websocket;
      let context;
      let processor;
      let globalStream;
      let client_id = Date.now();
      //const websocket_uri = `ws://localhost:8000/ws/${client_id}`;
      const websocket_uri = `ws://localhost:8000/listen`;
      const bufferSize = 4096;
      let isRecording = false;

      function initWebSocket() {
        document.getElementById(
          "websocketAddress"
        ).value = `ws://localhost:8000/listen`;
        const websocketAddress =
          document.getElementById("websocketAddress").value;
        chunk_length_seconds = document.getElementById(
          "chunk_length_seconds"
        ).value;
        chunk_offset_seconds = document.getElementById(
          "chunk_offset_seconds"
        ).value;
        const selectedLanguage =
          document.getElementById("languageSelect").value;
        language =
          selectedLanguage !== "multilingual" ? selectedLanguage : null;

        if (!websocketAddress) {
          console.log("WebSocket address is required.");
          return;
        }

        websocket = new WebSocket(websocketAddress);
        websocket.onopen = () => {
          console.log("WebSocket connection established");
          document.getElementById("webSocketStatus").textContent = "Connected";
          document.getElementById("startButton").disabled = false;
        };
        websocket.onclose = (event) => {
          console.log("WebSocket connection closed", event);
          document.getElementById("webSocketStatus").textContent =
            "Not Connected";
          document.getElementById("startButton").disabled = true;
          document.getElementById("stopButton").disabled = true;
        };
        websocket.onmessage = (event) => {
          console.log("Message from server:", event.data);
          updateTranscription(event.data);
        };
      }

      function updateTranscription(transcript) {
        const transcriptionDiv = document.getElementById("transcription");
        transcriptionDiv.textContent += transcript + "\n";
      }

      function startRecording() {
        if (isRecording) return;
        isRecording = true;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        context = new AudioContext();

        navigator.mediaDevices
          .getUserMedia({ audio: true })
          .then((stream) => {
            globalStream = stream;
            const input = context.createMediaStreamSource(stream);
            processor = context.createScriptProcessor(bufferSize, 1, 1);
            processor.onaudioprocess = (e) => processAudio(e);
            input.connect(processor);
            processor.connect(context.destination);

            //sendAudioConfig();
          })
          .catch((error) => console.error("Error accessing microphone", error));

        // Disable start button and enable stop button
        document.getElementById("startButton").disabled = true;
        document.getElementById("stopButton").disabled = false;
      }

      function stopRecording() {
        if (!isRecording) return;
        isRecording = false;

        if (globalStream) {
          globalStream.getTracks().forEach((track) => track.stop());
        }
        if (processor) {
          processor.disconnect();
          processor = null;
        }
        if (context) {
          context.close().then(() => (context = null));
        }
        document.getElementById("startButton").disabled = false;
        document.getElementById("stopButton").disabled = true;
      }

      function sendAudioConfig() {
        const audioConfig = {
          type: "config",
          data: {
            sampleRate: context.sampleRate,
            bufferSize: bufferSize,
            channels: 1, // Assuming mono channel
            chunk_length_seconds: chunk_length_seconds,
            chunk_offset_seconds: chunk_offset_seconds,
            language: language,
          },
        };
        websocket.send(JSON.stringify(audioConfig));
      }

      function downsampleBuffer(buffer, inputSampleRate, outputSampleRate) {
        if (inputSampleRate === outputSampleRate) {
          return buffer;
        }
        var sampleRateRatio = inputSampleRate / outputSampleRate;
        var newLength = Math.round(buffer.length / sampleRateRatio);
        var result = new Float32Array(newLength);
        var offsetResult = 0;
        var offsetBuffer = 0;
        while (offsetResult < result.length) {
          var nextOffsetBuffer = Math.round(
            (offsetResult + 1) * sampleRateRatio
          );
          var accum = 0,
            count = 0;
          for (
            var i = offsetBuffer;
            i < nextOffsetBuffer && i < buffer.length;
            i++
          ) {
            accum += buffer[i];
            count++;
          }
          result[offsetResult] = accum / count;
          offsetResult++;
          offsetBuffer = nextOffsetBuffer;
        }
        return result;
      }

      function processAudio(e) {
        const inputSampleRate = context.sampleRate;
        const outputSampleRate = 128000; // Target sample rate

        const left = e.inputBuffer.getChannelData(0);
        const downsampledBuffer = downsampleBuffer(
          left,
          inputSampleRate,
          outputSampleRate
        );
        const audioData = convertFloat32ToInt16(downsampledBuffer);

        if (websocket && websocket.readyState === WebSocket.OPEN) {
          console.log(audioData);
          websocket.send(audioData);
        }
      }

      function convertFloat32ToInt16(buffer) {
        let l = buffer.length;
        const buf = new Int16Array(l);
        while (l--) {
          buf[l] = Math.min(1, buffer[l]) * 0x7fff;
        }
        return buf.buffer;
      }

      // Initialize WebSocket on page load
      //  window.onload = initWebSocket;
    </script>
  </body>
</html>
